                        <body>
                            <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>67 Speed — Arm Speed Challenge</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    font-family: 'Trebuchet MS', system-ui, sans-serif;
    background: #0a0a0f;
    color: #fff;
    overflow: hidden;
  }
  .app {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at center, #1a1a2e 0%, #0a0a0f 100%);
  }
  h1 {
    font-size: clamp(2.5rem, 7vw, 5rem);
    font-weight: 900;
    background: linear-gradient(45deg, #ff006e, #8338ec, #3a86ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 40px rgba(131, 56, 236, 0.5);
    margin-bottom: 0.2em;
    letter-spacing: 2px;
  }
  .subtitle {
    color: #aaa;
    margin-bottom: 1.5em;
    font-size: 1.1rem;
  }
  .screen {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
    width: 100%;
    height: 100%;
    padding: 2rem;
  }
  .screen.active { display: flex; }
  .btn {
    background: linear-gradient(45deg, #ff006e, #8338ec);
    color: white;
    border: none;
    padding: 1.2rem 3rem;
    font-size: 1.4rem;
    font-weight: bold;
    border-radius: 50px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 2px;
    box-shadow: 0 8px 25px rgba(255, 0, 110, 0.4);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 35px rgba(255, 0, 110, 0.6); }
  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .video-container {
    position: relative;
    width: min(90vw, 640px);
    aspect-ratio: 4/3;
    border-radius: 20px;
    overflow: hidden;
    border: 3px solid #8338ec;
    box-shadow: 0 0 40px rgba(131, 56, 236, 0.4);
  }
  #webcam, #canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    transform: scaleX(-1); /* mirror */
    object-fit: cover;
  }
  #canvas { pointer-events: none; }

  .hud {
    display: flex;
    gap: 2rem;
    align-items: center;
    font-size: 1.3rem;
    font-weight: bold;
  }
  .hud-item {
    background: rgba(0,0,0,0.5);
    padding: 0.8rem 1.5rem;
    border-radius: 15px;
    border: 1px solid rgba(131, 56, 236, 0.3);
  }
  .hud-item .label { color: #aaa; font-size: 0.8rem; text-transform: uppercase; }
  .hud-item .value { color: #fff; font-size: 2rem; font-weight: 900; }
  .timer { color: #ff006e; }
  .score { color: #3a86ff; }

  .result {
    text-align: center;
  }
  .result .big-score {
    font-size: clamp(5rem, 15vw, 10rem);
    font-weight: 900;
    background: linear-gradient(45deg, #ff006e, #8338ec);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    line-height: 1;
  }
  .result .label { color: #aaa; font-size: 1.2rem; margin-top: 0.5rem; }
  .rank {
    font-size: 1.5rem;
    margin: 1rem 0;
    padding: 0.5rem 1.5rem;
    border-radius: 30px;
    display: inline-block;
  }
  .rank-bronze { background: #cd7f32; }
  .rank-silver { background: linear-gradient(45deg, #aaa, #fff); color: #000; }
  .rank-gold   { background: linear-gradient(45deg, #ffd700, #ffae00); color: #000; }
  .rank-elite  { background: linear-gradient(45deg, #ff006e, #8338ec); }
  .error-msg {
    color: #ff5577;
    background: rgba(255,0,0,0.1);
    padding: 1rem;
    border-radius: 10px;
    max-width: 400px;
    text-align: center;
  }
  .footer {
    position: absolute;
    bottom: 10px;
    color: #555;
    font-size: 0.8rem;
  }
</style>
</head>
<body>
<div class="app">

  <!-- START SCREEN -->
  <div id="startScreen" class="screen active">
    <h1>67 SPEED</h1>
    <p class="subtitle">Pump your arms like the 6-7 gesture. 20 seconds. Beat your record.</p>
    <button id="startBtn" class="btn">▶ Start Challenge</button>
    <p class="subtitle" style="font-size: 0.85rem; max-width: 400px; text-align: center;">
      Camera stays on your device. Powered by MediaPipe pose detection.
    </p>
  </div>

  <!-- GAME SCREEN -->
  <div id="gameScreen" class="screen">
    <div class="hud">
      <div class="hud-item timer">
        <div class="label">Time</div>
        <div class="value" id="timerDisplay">20.0</div>
      </div>
      <div class="hud-item score">
        <div class="label">Score</div>
        <div class="value" id="scoreDisplay">0</div>
      </div>
    </div>
    <div class="video-container">
      <video id="webcam" autoplay playsinline muted></video>
      <canvas id="canvas"></canvas>
    </div>
  </div>

  <!-- END SCREEN -->
  <div id="endScreen" class="screen">
    <div class="result">
      <h1>Time's Up!</h1>
      <div class="big-score" id="finalScore">0</div>
      <div class="label">reps in 20 seconds</div>
      <div id="rankBadge" class="rank">—</div>
      <br/><br/>
      <button id="againBtn" class="btn">↻ Play Again</button>
    </div>
  </div>

  <div class="footer">Local processing • No data uploaded</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

<script>
(() => {
  const startScreen = document.getElementById('startScreen');
  const gameScreen  = document.getElementById('gameScreen');
  const endScreen   = document.getElementById('endScreen');
  const startBtn    = document.getElementById('startBtn');
  const againBtn    = document.getElementById('againBtn');
  const videoEl     = document.getElementById('webcam');
  const canvasEl    = document.getElementById('canvas');
  const ctx         = canvasEl.getContext('2d');
  const timerEl     = document.getElementById('timerDisplay');
  const scoreEl     = document.getElementById('scoreDisplay');
  const finalScoreEl= document.getElementById('finalScore');
  const rankBadgeEl = document.getElementById('rankBadge');

  const GAME_DURATION = 20; // seconds
  let score = 0;
  let timerValue = GAME_DURATION;
  let gameRunning = false;
  let timerInterval = null;
  let lastRepState = null; // 'up' or 'down' — used to count full cycles
  let pose = null;
  let stream = null;
  let detected = false;

  // MediaPipe pose landmarks indices:
  // 15 = left wrist, 16 = right wrist
  // 11 = left shoulder, 12 = right shoulder
  // We'll track the average Y position of the two wrists (in normalized 0..1 coords, 0=top, 1=bottom)

  function showScreen(name) {
    [startScreen, gameScreen, endScreen].forEach(s => s.classList.remove('active'));
    document.getElementById(name + 'Screen').classList.add('active');
  }

  function getRank(n) {
    if (n >= 80) return { name: 'ELITE 🔥', cls: 'rank-elite' };
    if (n >= 60) return { name: 'GOLD 🥇', cls: 'rank-gold' };
    if (n >= 40) return { name: 'SILVER 🥈', cls: 'rank-silver' };
    return { name: 'BRONZE 🥉', cls: 'rank-bronze' };
  }

  async function initCamera() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { width: 640, height: 480, facingMode: 'user' },
        audio: false
      });
      videoEl.srcObject = stream;
      await new Promise(res => videoEl.onloadedmetadata = res);
    } catch (e) {
      alert('Camera access denied or unavailable: ' + e.message);
      throw e;
    }
  }

  function setupPose() {
    pose = new Pose({
      locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });
    pose.setOptions({
      modelComplexity: 0,
      smoothLandmarks: true,
      enableSegmentation: false,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });
    pose.onResults(onPoseResults);
  }

  async function startDetection() {
    const camera = new Camera(videoEl, {
      onFrame: async () => {
        if (pose && videoEl.readyState >= 2) {
          await pose.send({ image: videoEl });
        }
      },
      width: 640,
      height: 480
    });
    camera.start();
  }

  function onPoseResults(results) {
    canvasEl.width = videoEl.videoWidth;
    canvasEl.height = videoEl.videoHeight;
    ctx.save();
    ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);

    if (results.poseLandmarks) {
      detected = true;
      // Draw skeleton
      drawConnectors(ctx, results.poseLandmarks, POSE_CONNECTIONS, { color: '#8338ec', lineWidth: 3 });
      drawLandmarks(ctx, results.poseLandmarks, { color: '#ff006e', lineWidth: 2, radius: 4 });

      // Count a rep when the average wrist Y position makes a full up→down→up cycle
      // (or down→up→down). We detect state changes.
      const lm = results.poseLandmarks;
      const lw = lm[15], rw = lm[16];
      const ls = lm[11], rs = lm[12];

      if (lw && rw && ls && rs && lw.visibility > 0.5 && rw.visibility > 0.5) {
        // Use the vertical position of each wrist relative to the corresponding shoulder
        // (negative = above shoulder, positive = below)
        const lRel = lw.y - ls.y;   // smaller = higher
        const rRel = rw.y - rs.y;
        const avgRel = (lRel + rRel) / 2;

        // Threshold: when avgRel < -0.05 => hands are up; when avgRel > 0.15 => hands are down
        const UP_THRESHOLD   = -0.05;
        const DOWN_THRESHOLD =  0.15;

        let currentState = null;
        if (avgRel < UP_THRESHOLD) currentState = 'up';
        else if (avgRel > DOWN_THRESHOLD) currentState = 'down';

        if (gameRunning && currentState) {
          if (lastRepState && currentState !== lastRepState) {
            // If we previously had a complete pair of states, count a rep
            // Simple approach: count every state change (up<->down) while ensuring full cycle
            if (lastRepState === 'up' && currentState === 'down') {
              // going from up to down = 1 rep completed
              score++;
              scoreEl.textContent = score;
            } else if (lastRepState === 'down' && currentState === 'up') {
              // going back up to start next rep
            }
          }
          if (currentState) lastRepState = currentState;
        }

        // Visual feedback on the canvas: draw a status bar
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(10, 10, 220, 50);
        ctx.fillStyle = currentState === 'up' ? '#3a86ff' : '#ff006e';
        ctx.font = 'bold 18px sans-serif';
        ctx.fillText('Arms: ' + (currentState || '—').toUpperCase(), 20, 35);
        ctx.fillText('Reps: ' + score, 20, 55);
      }
    } else {
      // No person detected
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(10, 10, 280, 35);
      ctx.fillStyle = '#ff5577';
      ctx.font = 'bold 16px sans-serif';
      ctx.fillText('⚠ Stand in front of camera', 20, 33);
    }
    ctx.restore();
  }

  function startGame() {
    score = 0;
    timerValue = GAME_DURATION;
    lastRepState = null;
    scoreEl.textContent = '0';
    timerEl.textContent = GAME_DURATION.toFixed(1);
    showScreen('game');
    gameRunning = true;

    timerInterval = setInterval(() => {
      timerValue -= 0.1;
      if (timerValue <= 0) {
        timerValue = 0;
        endGame();
      }
      timerEl.textContent = timerValue.toFixed(1);
    }, 100);
  }

  function endGame() {
    gameRunning = false;
    clearInterval(timerInterval);
    finalScoreEl.textContent = score;
    const rank = getRank(score);
    rankBadgeEl.textContent = rank.name;
    rankBadgeEl.className = 'rank ' + rank.cls;
    showScreen('end');
  }

  startBtn.addEventListener('click', async () => {
    startBtn.disabled = true;
    startBtn.textContent = 'Loading...';
    try {
      await initCamera();
      setupPose();
      await startDetection();
      // Tiny delay to let pose warm up
      setTimeout(startGame, 500);
    } catch (e) {
      startBtn.disabled = false;
      startBtn.textContent = '▶ Start Challenge';
    }
  });

  againBtn.addEventListener('click', () => {
    showScreen('game');
    // restart the game using same stream
    setTimeout(startGame, 200);
  });

})();
</script>
</body>
</html>
